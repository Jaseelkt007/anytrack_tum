services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: anytrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anytrace
      POSTGRES_PASSWORD: anytrace
      POSTGRES_DB: anytrace
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anytrace -d anytrace"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Opt-in services (use --profile <name> to start) -----------------
  # Local dev usually runs api and worker natively (`uvicorn ...` and
  # `python -m worker`) for fast iteration. The container variants exist
  # so the topology mirrors prod (Fly.io machines) when you want it.
  api:
    profiles: ["api"]
    build: .
    image: anytrace-api
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://anytrace:anytrace@postgres:5432/anytrace
      DATABASE_URL_DIRECT: postgresql+psycopg://anytrace:anytrace@postgres:5432/anytrace
      PIPELINE_SCHEDULER_ENABLED: "0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["worker"]
    build: .
    image: anytrace-worker
    command: ["python", "-m", "worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://anytrace:anytrace@postgres:5432/anytrace
      DATABASE_URL_DIRECT: postgresql+psycopg://anytrace:anytrace@postgres:5432/anytrace
      BROWSERLESS_WS_URL: ws://browserless:3000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_TOKEN_2: ${GITHUB_TOKEN_2:-}
      GITHUB_TOKEN_3: ${GITHUB_TOKEN_3:-}
      GITHUB_TOKEN_4: ${GITHUB_TOKEN_4:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  # Browser pool — only needed by stealth-scraping sources (LinkedIn in #5).
  # Local dev: docker compose --profile browser up postgres browserless
  browserless:
    profiles: ["browser"]
    image: ghcr.io/browserless/chromium:latest
    container_name: anytrace-browserless
    restart: unless-stopped
    environment:
      CONCURRENT: "5"
      TOKEN: ${BROWSERLESS_TOKEN:-}
    ports:
      - "3000:3000"

volumes:
  postgres_data: {}
